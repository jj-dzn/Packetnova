    <title>PacketNova - Networking tools built for engineers</title>
    <!--
      script-src has no 'unsafe-inline': bootstrap.js is a same-origin
      external file specifically so this can stay strict. connect-src's
      extra hosts are the PingPet lab's real latency-check fetches
      (src/lib/labs/pingPet.ts's PING_TARGETS) -- update both together if
      that list ever changes. style-src needs 'unsafe-inline' because the
      app sets many dynamic inline style="" attributes (progress bars,
      positioned diagram elements) computed at render time, which can't be
      pre-hashed; CSS injection is a far lower-severity risk than script
      injection, which is what script-src is actually guarding against.
      No frame-ancestors here -- browsers ignore it entirely when set via
      <meta> (HTTP-header-only directive), and GitHub Pages doesn't let
      this static site set real response headers at all.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflare.com https://google.com https://github.com https://wikipedia.org; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <script src="/bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
