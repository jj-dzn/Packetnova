    <title>PacketNova - Networking tools built for engineers</title>
    <script>
      // Single Page Apps for GitHub Pages -- https://github.com/rafgraph/spa-github-pages
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('packetnova-theme')
          var isDark = stored === 'light' ? false : true
          document.documentElement.classList.toggle('dark', isDark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
        try {
          var colorblind = localStorage.getItem('packetnova-colorblind') === 'true'
          document.documentElement.classList.toggle('colorblind', colorblind)
        } catch (e) {
          // No stored preference and no way to read one -- leave the
          // default (non-colorblind) palette in place.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
