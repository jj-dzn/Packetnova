<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PacketNova - free, client-side networking toolkit: calculators, protocol explorers, and interactive visualizers."
    />
    <title>PacketNova - Networking tools built for engineers</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('packetnova-theme')
          var isDark = stored === 'light' ? false : true
          document.documentElement.classList.toggle('dark', isDark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
